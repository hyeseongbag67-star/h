<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anatomia 3D — 인체 해부학 아틀라스</title>
    <meta
      name="description"
      content="3D 인체 모형과 내부 장기를 탐색하고, 터치 시 각 기관의 명칭, 생리적 기능, 의학용어를 학습하는 인터랙티브 해부학 앱"
    />
    <meta property="og:title" content="Anatomia 3D — 인체 해부학 아틀라스" />
    <meta
      property="og:description"
      content="3D 인체 모형과 내부 장기를 탐색하고, 터치 시 각 기관의 명칭, 생리적 기능, 의학용어를 학습하는 인터랙티브 해부학 앱"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #090d16;
        --bg-panel: rgba(14, 21, 37, 0.95);
        --bg-panel-soft: rgba(14, 21, 37, 0.88);
        --bg-btn: rgba(30, 41, 59, 0.72);
        --bg-btn-hover: rgba(51, 65, 85, 0.92);
        --border-subtle: rgba(71, 85, 105, 0.52);
        --border-divider: rgba(30, 41, 59, 0.92);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent-sky: #38bdf8;
        --accent-sky-soft: #7dd3fc;
        --font-display: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-sans: "Noto Sans KR", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font-family: inherit;
      }

      .app-root {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg-canvas);
      }

      #viewport {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
      }

      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .fallback-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: var(--bg-canvas);
        z-index: 50;
      }

      .fallback-screen h2 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }

      .fallback-screen p {
        margin: 0;
        font-size: 14px;
        color: var(--text-muted);
        max-width: 420px;
        line-height: 1.6;
      }

      /* Custom Scrollbar */
      .anatomy-scroll::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .anatomy-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .anatomy-scroll::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.28);
        border-radius: 9999px;
      }
      .anatomy-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.48);
      }

      /* Top-left Header */
      .app-header {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: calc(100vw - 32px);
        pointer-events: none;
        user-select: none;
      }

      .header-card {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--bg-panel-soft);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .header-titles {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .header-title-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .brand-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
      }

      .brand-sub {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .header-hint {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .download-btn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid rgba(71, 85, 105, 0.65);
        background: rgba(30, 41, 59, 0.9);
        color: var(--accent-sky-soft);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .download-btn:hover {
        background: rgba(51, 65, 85, 0.95);
        color: #bae6fd;
      }

      /* Hover Tooltip */
      .hover-tooltip {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(14, 21, 37, 0.96);
        border: 1px solid rgba(100, 116, 139, 0.65);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot-swatch {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        flex-shrink: 0;
      }

      .tooltip-ko {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
      }

      .tooltip-en {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent-sky);
        white-space: nowrap;
      }

      /* Organ Inspector Drawer */
      .inspector {
        position: fixed;
        z-index: 20;
        top: 16px;
        right: 16px;
        bottom: 118px;
        width: 392px;
        max-width: calc(100vw - 32px);
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      .inspector-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border-divider);
        flex-shrink: 0;
      }

      .inspector-top-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .inspector-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 5px;
      }

      .inspector-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--text-primary);
      }

      .inspector-latin {
        margin: 4px 0 0;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-sky);
      }

      .inspector-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .btn-focus,
      .btn-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        border-radius: 8px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .btn-focus {
        padding: 0 12px;
      }

      .btn-close {
        width: 36px;
      }

      .btn-focus:hover,
      .btn-close:hover {
        background: var(--bg-btn-hover);
        color: #ffffff;
      }

      .inspector-summary {
        margin: 12px 0 0;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text-secondary);
      }

      .inspector-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 20px;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-divider);
      }

      .metric-label {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .metric-value {
        margin-top: 3px;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .section-heading {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-secondary);
      }

      .fn-list {
        list-style: none;
        margin: 0 0 22px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fn-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13.5px;
        line-height: 1.65;
        color: #e2e8f0;
      }

      .fn-num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        color: var(--accent-sky);
        margin-top: 3px;
        flex-shrink: 0;
      }

      .terms-list {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
      }

      .term-row {
        padding: 11px 0;
        border-bottom: 1px solid var(--border-divider);
      }

      .term-row:first-child {
        padding-top: 2px;
      }

      .term-row:last-child {
        border-bottom: none;
        padding-bottom: 2px;
      }

      .term-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .term-en {
        font-family: var(--font-display);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--accent-sky-soft);
      }

      .term-ko {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .term-meaning {
        margin: 5px 0 0;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-muted);
      }

      .related-section {
        padding-top: 14px;
        border-top: 1px solid var(--border-divider);
      }

      .related-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .related-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid rgba(71, 85, 105, 0.55);
        background: rgba(30, 41, 59, 0.8);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .related-btn:hover {
        background: var(--bg-btn-hover);
        color: #ffffff;
      }

      /* Bottom Control Dock */
      .dock-wrap {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        width: max-content;
        max-width: min(980px, 95vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }

      .directory-popover {
        pointer-events: auto;
        width: 100%;
        max-width: 680px;
        margin-bottom: 8px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(14, 21, 37, 0.97);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      }

      .directory-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border-divider);
        font-size: 12px;
        color: var(--text-secondary);
      }

      .directory-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 12px;
        cursor: pointer;
      }

      .directory-close:hover {
        color: var(--text-primary);
      }

      .directory-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        max-height: 200px;
        overflow-y: auto;
      }

      .dir-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: rgba(30, 41, 59, 0.65);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .dir-item:hover {
        background: rgba(30, 41, 59, 0.95);
        color: #ffffff;
      }

      .dir-item.active {
        background: rgba(56, 189, 248, 0.18);
        border-color: rgba(56, 189, 248, 0.5);
        color: #bae6fd;
      }

      .dir-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dock-toggle {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 14px;
        margin-bottom: 6px;
        border-radius: 8px 8px 6px 6px;
        border: 1px solid var(--border-subtle);
        background: rgba(14, 21, 37, 0.94);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .dock-toggle:hover {
        background: rgba(30, 41, 59, 0.96);
      }

      .dock-panel {
        pointer-events: auto;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .dock-panel.collapsed {
        display: none;
      }

      .dock-row-1 {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .dock-divider {
        width: 1px;
        height: 20px;
        background: rgba(71, 85, 105, 0.65);
        margin: 0 4px;
        flex-shrink: 0;
      }

      .sys-btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: none;
        background: var(--bg-btn);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .sys-btn:hover {
        background: var(--bg-btn-hover);
        color: #ffffff;
      }

      .sys-btn.active {
        background: var(--accent-sky);
        color: #082f49;
        font-weight: 600;
      }

      .dir-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: none;
        background: var(--bg-btn);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
      }

      .dir-trigger:hover,
      .dir-trigger.active {
        background: rgba(51, 65, 85, 0.95);
      }

      .dock-row-2 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border-divider);
      }

      .explode-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 185px;
        flex: 1 1 200px;
        max-width: 240px;
      }

      .explode-label {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .explode-slider {
        width: 100%;
        height: 5px;
        accent-color: var(--accent-sky);
        cursor: pointer;
      }

      .explode-val {
        width: 36px;
        text-align: right;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .segmented {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(30, 41, 59, 0.95);
      }

      .seg-btn {
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      .seg-btn:hover {
        color: var(--text-primary);
      }

      .seg-btn.active {
        background: rgba(51, 65, 85, 0.95);
        color: var(--accent-sky-soft);
      }

      .layer-group,
      .preset-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .layer-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: rgba(30, 41, 59, 0.65);
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      .layer-btn:hover {
        color: var(--text-primary);
      }

      .layer-btn.active-sky {
        background: rgba(51, 65, 85, 0.92);
        border-color: rgba(56, 189, 248, 0.35);
        color: var(--accent-sky-soft);
      }

      .layer-btn.active-rose {
        background: rgba(51, 65, 85, 0.92);
        border-color: rgba(244, 63, 94, 0.35);
        color: #fda4af;
      }

      .preset-btn {
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        border: none;
        background: var(--bg-btn);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      .preset-btn:hover {
        background: var(--bg-btn-hover);
        color: #ffffff;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 767px) {
        .app-header {
          top: 10px;
          left: 10px;
          max-width: calc(100vw - 20px);
        }
        .header-card {
          padding: 8px 12px;
          gap: 10px;
        }
        .header-hint {
          display: none;
        }
        .inspector {
          z-index: 30;
          top: auto;
          bottom: 12px;
          left: 12px;
          right: 12px;
          width: auto;
          max-width: none;
          max-height: 56dvh;
        }
        .directory-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dock-wrap {
          bottom: 10px;
          max-width: 96vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-root">
      <div id="viewport" aria-label="3D 인체 해부학 뷰포트"></div>

      <header class="app-header">
        <div class="header-card">
          <div class="header-titles">
            <div class="header-title-row">
              <h1 class="brand-title">Anatomia 3D</h1>
              <span class="brand-sub">인체 해부학 아틀라스</span>
            </div>
            <p class="header-hint">장기·혈관·감각기관·피부를 터치하여 기능과 의학용어를 확인하세요</p>
          </div>
          <button id="download-zip-btn" type="button" class="download-btn hidden" title="앱 전체 파일(.zip) 다운로드">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>

            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(rad) * inner, cy + Math.sin(rad) * inner);
            ctx.lineTo(cx + Math.cos(rad) * outer, cy + Math.sin(rad) * outer);
            ctx.strokeStyle = isMajor ? 'rgba(56, 189, 248, 0.45)' : 'rgba(148, 163, 184, 0.18)';

          ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.lineWidth = 1.5;

          ctx.moveTo(cx - 460, cy);
          ctx.lineTo(cx + 460, cy);
          ctx.moveTo(cx, cy - 460);

        // =========================================================================
        // 4. PROCEDURAL 3D ANATOMY BUILDER
        // =========================================================================
        function createVariableRadiusTube(curve, tubularSegments, radialSegments, radiusFn) {
          var frames = curve.computeFrenetFrames(tubularSegments, false);
          var vertices = [];
          var uvs = [];
          var indices = [];
          var P = new THREE.Vector3();
          var N = new THREE.Vector3();
          var B = new THREE.Vector3();
          var vertex = new THREE.Vector3();

          for (var i = 0; i <= tubularSegments; i++) {
            var t = i / tubularSegments;
            curve.getPointAt(t, P);
            N.copy(frames.normals[i]);
            B.copy(frames.binormals[i]);
            for (var j = 0; j <= radialSegments; j++) {
              var v = (j / radialSegments) * Math.PI * 2;
              var r = radiusFn(t, v);
              var sin = Math.sin(v);
              var cos = -Math.cos(v);
              vertex.x = P.x + r * (cos * N.x + sin * B.x);
              vertex.y = P.y + r * (cos * N.y + sin * B.y);
              vertex.z = P.z + r * (cos * N.z + sin * B.z);
              vertices.push(vertex.x, vertex.y, vertex.z);
              uvs.push(t, j / radialSegments);
            }
          }

          for (var jj = 1; jj <= tubularSegments; jj++) {
            for (var ii = 1; ii <= radialSegments; ii++) {
              var a = (radialSegments + 1) * (jj - 1) + (ii - 1);
              var b = (radialSegments + 1) * jj + (ii - 1);
              var c = (radialSegments + 1) * jj + ii;
              var d = (radialSegments + 1) * (jj - 1) + ii;
              indices.push(a, b, d);
              indices.push(b, c, d);
            }
          }

          var geom = new THREE.BufferGeometry();
          geom.setIndex(indices);
          geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
          geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          geom.computeVertexNormals();
          return geom;
        }

        function createSculptedSphere(radius, widthSegments, heightSegments, deform) {
          var geom = new THREE.SphereGeometry(radius, widthSegments, heightSegments);
          var pos = geom.attributes.position;
          var v = new THREE.Vector3();
          for (var i = 0; i < pos.count; i++) {
            v.fromBufferAttribute(pos, i);
            deform(v);
            pos.setXYZ(i, v.x, v.y, v.z);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          return geom;
        }

        function buildBodyPartGeometries() {
          var torsoProfile = [
            [0.82, 0.145, 0.095],
            [0.88, 0.165, 0.108],
            [0.95, 0.158, 0.104],
            [1.04, 0.142, 0.094],
            [1.14, 0.155, 0.104],
            [1.26, 0.174, 0.114],
            [1.37, 0.188, 0.115],
            [1.45, 0.195, 0.098],
            [1.49, 0.105, 0.072],
            [1.52, 0.058, 0.056],
            [1.58, 0.054, 0.054]
          ];
          var lathePoints = torsoProfile.map(function (p) {
            return new THREE.Vector2(1, p[0]);
          });
          var torsoGeom = new THREE.LatheGeometry(lathePoints, 48);
          var tPos = torsoGeom.attributes.position;
          for (var i = 0; i < tPos.count; i++) {
            var x = tPos.getX(i);
            var y = tPos.getY(i);
            var z = tPos.getZ(i);
            var rx = 0.15;
            var rz = 0.10;
            for (var k = 0; k < torsoProfile.length - 1; k++) {
              var y0 = torsoProfile[k][0], rx0 = torsoProfile[k][1], rz0 = torsoProfile[k][2];
              var y1 = torsoProfile[k + 1][0], rx1 = torsoProfile[k + 1][1], rz1 = torsoProfile[k + 1][2];
              if (y >= y0 - 0.001 && y <= y1 + 0.001) {
                var t = THREE.MathUtils.clamp((y - y0) / (y1 - y0), 0, 1);
                rx = THREE.MathUtils.lerp(rx0, rx1, t);
                rz = THREE.MathUtils.lerp(rz0, rz1, t);
                break;
              }
            }
            var angle = Math.atan2(z, x);
            var frontFactor = Math.sin(angle);
            var zShift = 0;
            if (y > 1.22 && y < 1.44 && frontFactor > 0) {
              zShift += frontFactor * 0.014 * Math.sin(((y - 1.22) / 0.22) * Math.PI);
            }
            if (y > 0.96 && y < 1.15 && frontFactor < 0) {
              zShift += -frontFactor * 0.012;
            }
            tPos.setXYZ(i, x * rx, y, z * rz + zShift);
          }
          torsoGeom.computeVertexNormals();

          var headGeom = createSculptedSphere(0.105, 40, 32, function (v) {
            v.x *= 0.80;
            v.y *= 1.12;
            v.z *= 0.94;
            if (v.y < -0.02) {
              var chinFactor = Math.min(1, (-v.y - 0.02) / 0.09);
              v.x *= 1 - chinFactor * 0.35;
              if (v.z > 0) v.z += chinFactor * 0.012;
            }
            if (v.z < -0.02 && v.y > -0.02) {
              v.z -= 0.01;
            }
            if (v.z > 0.04) {
              var dy = v.y - 0.01;
              [-0.031, 0.031].forEach(function (ex) {
                var dx = v.x - ex;
                var d2 = dx * dx + dy * dy;
                if (d2 < 0.00045) {
                  v.z -= (1 - d2 / 0.00045) * 0.015;
                }
              });
            }
          });

          var armGeoms = [-1, 1].map(function (side) {
            var armCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(side * 0.175, 1.425, 0.0),
              new THREE.Vector3(side * 0.225, 1.36, -0.005),
              new THREE.Vector3(side * 0.242, 1.17, -0.012),
              new THREE.Vector3(side * 0.258, 0.98, 0.018),
              new THREE.Vector3(side * 0.270, 0.85, 0.036),
              new THREE.Vector3(side * 0.276, 0.77, 0.044)
            ]);
            return createVariableRadiusTube(armCurve, 32, 16, function (t) {
              if (t < 0.18) return THREE.MathUtils.lerp(0.056, 0.052, t / 0.18);
              if (t < 0.48) return THREE.MathUtils.lerp(0.052, 0.042, (t - 0.18) / 0.3);
              if (t < 0.82) return THREE.MathUtils.lerp(0.042, 0.028, (t - 0.48) / 0.34);
              return THREE.MathUtils.lerp(0.028, 0.018, (t - 0.82) / 0.18);
            });
          });

          var legEntries = [-1, 1].map(function (side) {
            var legCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(side * 0.095, 0.86, 0.0),
              new THREE.Vector3(side * 0.10, 0.66, 0.006),
              new THREE.Vector3(side * 0.098, 0.46, 0.004),
              new THREE.Vector3(side * 0.096, 0.28, -0.008),
              new THREE.Vector3(side * 0.095, 0.06, -0.005)
            ]);
            var legGeom = createVariableRadiusTube(legCurve, 32, 18, function (t) {
              if (t < 0.35) return THREE.MathUtils.lerp(0.082, 0.064, t / 0.35);
              if (t < 0.55) return THREE.MathUtils.lerp(0.064, 0.054, (t - 0.35) / 0.2);
              if (t < 0.72) return THREE.MathUtils.lerp(0.054, 0.056, (t - 0.55) / 0.17);
              return THREE.MathUtils.lerp(0.056, 0.036, (t - 0.72) / 0.28);
            });
            var footGeom = createSculptedSphere(0.048, 18, 14, function (v) {
              v.x *= 0.78;
              v.y *= 0.52;
              v.z *= 1.95;
              if (v.y < 0) v.y *= 0.25;
            });
            return { side: side, legGeom: legGeom, footGeom: footGeom };
          });

          return { torsoGeom: torsoGeom, headGeom: headGeom, armGeoms: armGeoms, legEntries: legEntries };
        }

            new THREE.Vector3(0.012, -0.032, 0.014),
            new THREE.Vector3(-0.026, -0.026, 0.006),
            new THREE.Vector3(-0.044, -0.018, -0.005)
          ]);
          stomachGroup.add(
            new THREE.Mesh(
              createVariableRadiusTube(stomachCurve, 36, 20, function (t) {
                if (t < 0.2) return THREE.MathUtils.lerp(0.010, 0.032, t / 0.2);
                if (t < 0.58) return THREE.MathUtils.lerp(0.032, 0.028, (t - 0.2) / 0.38);
                return THREE.MathUtils.lerp(0.028, 0.011, (t - 0.58) / 0.42);
              }),
              stomachMat
            )
          );
          var fundus = new THREE.Mesh(new THREE.SphereGeometry(0.028, 18, 14), stomachMat);
          fundus.position.set(0.015, 0.048, -0.004);
          stomachGroup.add(fundus);
          registerOrgan('stomach', stomachGroup);

          // 12. Spleen
          var spleenGroup = new THREE.Group();
          var spleenGeom = createSculptedSphere(0.032, 24, 18, function (v) {
            v.x *= 0.58;
            v.y *= 1.15;
            v.z *= 0.85;
            if (v.x < 0) v.x *= 0.65;
          });
          var spleenMesh = new THREE.Mesh(
            spleenGeom,
            new THREE.MeshStandardMaterial({ color: 0x6c243a, bumpMap: textures.organicBump, bumpScale: 0.002, roughness: 0.38, metalness: 0.04 })
          );
          spleenMesh.rotation.set(0.25, 0.35, -0.25);
          spleenGroup.add(spleenMesh);
          registerOrgan('spleen', spleenGroup);

          // 13. Pancreas
          var pancreasGroup = new THREE.Group();
          var panCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.042, -0.014, 0.004),
            new THREE.Vector3(-0.012, -0.004, 0.006),
            new THREE.Vector3(0.025, 0.006, 0.0),
            new THREE.Vector3(0.068, 0.018, -0.014)
          ]);
          var panGeom = createVariableRadiusTube(panCurve, 28, 14, function (t, angle) {
            var baseR = t < 0.25 ? THREE.MathUtils.lerp(0.021, 0.015, t / 0.25) : THREE.MathUtils.lerp(0.015, 0.006, (t - 0.25) / 0.75);
            return baseR * (1 + 0.09 * Math.sin(t * 42) * Math.cos(angle * 3));
          });
          pancreasGroup.add(
            new THREE.Mesh(panGeom, new THREE.MeshStandardMaterial({ color: 0xd9ad5b, bumpMap: textures.organicBump, bumpScale: 0.0038, roughness: 0.55 }))
          );
          registerOrgan('pancreas', pancreasGroup);

          // 14. Kidneys
          var kidneysGroup = new THREE.Group();
          var kidneyMat = new THREE.MeshStandardMaterial({ color: 0x8f3339, bumpMap: textures.organicBump, bumpScale: 0.0018, roughness: 0.38, metalness: 0.05 });
          var adrenalMat = new THREE.MeshStandardMaterial({ color: 0xdca74c, roughness: 0.52 });
          var ureterMat = new THREE.MeshStandardMaterial({ color: 0xd9bfa9, roughness: 0.52 });
          [-1, 1].forEach(function (side) {
            var yOffset = side === -1 ? -0.010 : 0.008;
            var xPos = side * 0.058;
            var kGeom = createSculptedSphere(0.028, 24, 18, function (v) {
              v.x *= 0.75;
              v.y *= 1.32;
              v.z *= 0.68;
              if (side * v.x < -0.005 && Math.abs(v.y) < 0.018) v.x += side * 0.008;
            });
            var kidney = new THREE.Mesh(kGeom, kidneyMat);
            kidney.position.set(xPos, yOffset, 0);
            kidney.rotation.z = side * -0.15;
            kidneysGroup.add(kidney);

            var adrenal = new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.016, 12), adrenalMat);
            adrenal.position.set(xPos - side * 0.003, yOffset + 0.036, 0.002);
            adrenal.rotation.z = side * 0.25;
            kidneysGroup.add(adrenal);

            var uCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(xPos - side * 0.014, yOffset - 0.006, 0.002),
              new THREE.Vector3(xPos - side * 0.022, yOffset - 0.075, 0.014),
              new THREE.Vector3(side * 0.018, yOffset - 0.145, 0.036)
            ]);
            kidneysGroup.add(new THREE.Mesh(new THREE.TubeGeometry(uCurve, 18, 0.003, 8, false), ureterMat));
          });
          registerOrgan('kidneys', kidneysGroup);

          // 15. Intestines
          var intestinesGroup = new THREE.Group();
          var largeIntMat = new THREE.MeshStandardMaterial({ color: 0xc28172, bumpMap: textures.organicBump, bumpScale: 0.0025, roughness: 0.5 });
          var smallIntMat = new THREE.MeshStandardMaterial({ color: 0xdca08e, bumpMap: textures.organicBump, bumpScale: 0.002, roughness: 0.44 });
          var colonCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.072, -0.072, 0.016),
            new THREE.Vector3(-0.082, -0.015, 0.012),
            new THREE.Vector3(-0.078, 0.056, 0.014),
            new THREE.Vector3(-0.025, 0.068, 0.028),
            new THREE.Vector3(0.032, 0.066, 0.028),
            new THREE.Vector3(0.082, 0.072, 0.006),
            new THREE.Vector3(0.084, 0.005, 0.008),
            new THREE.Vector3(0.074, -0.065, 0.012),
            new THREE.Vector3(0.028, -0.084, 0.004),
            new THREE.Vector3(0.0, -0.105, -0.018)
          ]);
          intestinesGroup.add(
            new THREE.Mesh(
              createVariableRadiusTube(colonCurve, 84, 16, function (t) {
                return 0.0165 * (1 + 0.18 * Math.abs(Math.sin(t * Math.PI * 24)));
              }),
              largeIntMat
            )
          );
          var smallCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.025, 0.042, 0.004),
            new THREE.Vector3(0.038, 0.036, 0.022),
            new THREE.Vector3(-0.044, 0.022, 0.026),
            new THREE.Vector3(0.042, 0.008, 0.030),
            new THREE.Vector3(-0.046, -0.008, 0.024),
            new THREE.Vector3(0.040, -0.022, 0.028),
            new THREE.Vector3(-0.038, -0.038, 0.022),
            new THREE.Vector3(0.034, -0.052, 0.024),
            new THREE.Vector3(-0.026, -0.064, 0.018),
            new THREE.Vector3(0.018, -0.072, 0.014),
            new THREE.Vector3(-0.064, -0.068, 0.015)
          ]);
          intestinesGroup.add(new THREE.Mesh(new THREE.TubeGeometry(smallCurve, 120, 0.0112, 12, false), smallIntMat));
          registerOrgan('intestines', intestinesGroup);

          return {
            rootGroup: rootGroup,
            shellGroup: shellGroup,
            shellMat: shellMat,
            skinGroup: skinGroup,
            skeletonGroup: skeletonGroup,
            boneMat: boneMat,
            organs: organs,
            raycastTargets: raycastTargets,
            heartGroup: heartGroup,
            lungsGroup: lungsGroup,
            vesselsGroup: vesselsGroup
          };
        }

        // =========================================================================
        // 5. WEBGL VIEWPORT INITIALIZATION & ANIMATION LOOP
        // =========================================================================
        function detectSoftwareWebGL() {
          try {
            var probe = document.createElement('canvas');
            var gl = probe.getContext('webgl2') || probe.getContext('webgl');
            if (!gl) return true;
            var ext = gl.getExtension('WEBGL_debug_renderer_info');
            var param = ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER;
            var gpu = String(gl.getParameter(param));
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
            return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
          } catch (e) {
            return true;
          }
        }

        var isSoftwareGl = detectSoftwareWebGL();
        var renderer;
        try {
          renderer = new THREE.WebGLRenderer({
            antialias: !isSoftwareGl,
            powerPreference: 'high-performance'
          });
        } catch (err) {
          showFallback('이 브라우저에서는 WebGL 3D 가속을 초기화할 수 없습니다.');
          return;
        }

        var width = elViewport.clientWidth || window.innerWidth;
        var height = elViewport.clientHeight || window.innerHeight;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = !isSoftwareGl;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        var canvas = renderer.domElement;
        elViewport.appendChild(canvas);

        canvas.addEventListener('webglcontextlost', function (e) {
          e.preventDefault();
          showFallback('3D 그래픽 컨텍스트가 일시 중단되었습니다. 페이지를 새로고침 해주세요.');
        });
        canvas.addEventListener('webglcontextrestored', function () {
          elFallback.classList.add('hidden');
        });

        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090d16);
        scene.fog = new THREE.FogExp2(0x090d16, 0.13);

        if (typeof THREE.RoomEnvironment === 'function') {
          var pmremGenerator = new THREE.PMREMGenerator(renderer);
          var roomEnv = new THREE.RoomEnvironment();
          scene.environment = pmremGenerator.fromScene(roomEnv, 0.04).texture;
          roomEnv.dispose();
          pmremGenerator.dispose();
        }

        var camera = new THREE.PerspectiveCamera(38, width / height, 0.05, 30);
        camera.position.set(CAMERA_PRESETS[0].position[0], CAMERA_PRESETS[0].position[1], CAMERA_PRESETS[0].position[2]);

        var controls = new THREE.OrbitControls(camera, canvas);
        controls.target.set(CAMERA_PRESETS[0].target[0], CAMERA_PRESETS[0].target[1], CAMERA_PRESETS[0].target[2]);
        controls.enableDamping = !isSoftwareGl;
        controls.dampingFactor = 0.07;
        controls.minDistance = 0.28;
        controls.maxDistance = 4.2;
        controls.maxPolarAngle = Math.PI * 0.54;
        controls.minPolarAngle = 0.15;
        controls.enablePan = true;
        controls.update();

        var cameraGoal = {
          active: false,
          target: new THREE.Vector3(),
          position: new THREE.Vector3()
        };

        controls.addEventListener('start', function () {
          cameraGoal.active = false;
        });

        // Studio 3-Point + Hemisphere Lighting
        scene.add(new THREE.HemisphereLight(0xb8d4f4, 0x161d2e, 0.78));

        var keyLight = new THREE.DirectionalLight(0xfff2e2, 1.85);
        keyLight.position.set(1.8, 2.8, 2.2);
        keyLight.castShadow = !isSoftwareGl;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 8;
        keyLight.shadow.camera.left = -1.1;
        keyLight.shadow.camera.right = 1.1;
        keyLight.shadow.camera.top = 1.4;
        keyLight.shadow.camera.bottom = -1.1;
        keyLight.shadow.bias = -0.0005;
        keyLight.shadow.normalBias = 0.02;
        scene.add(keyLight);

        var rimLight = new THREE.DirectionalLight(0x7ac7f8, 1.05);
        rimLight.position.set(-2.0, 2.2, -1.8);
        scene.add(rimLight);

        var fillLight = new THREE.DirectionalLight(0xc2d8f0, 0.50);
        fillLight.position.set(-1.6, 1.0, 1.5);
        scene.add(fillLight);

        var maxAniso = renderer.capabilities.getMaxAnisotropy();
        var brainTex = createBrainGyriTexture(maxAniso);
        var skinTex = createSkinTexture(maxAniso);
        var textures = {
          brainColor: brainTex.colorMap,
          brainBump: brainTex.bumpMap,
          skinColor: skinTex.colorMap,
          skinBump: skinTex.bumpMap,
          organicBump: createOrganicBumpTexture(maxAniso),
          lungColor: createLungTexture(maxAniso),
          plinthDial: createPlinthDialTexture(maxAnisotropyFallback(maxAniso)),
          contactShadow: createContactShadowTexture()
        };

        function maxAnisotropyFallback(v) {
          return v || 1;
        }

        var assets = buildAnatomyScene(textures, isSoftwareGl);
        scene.add(assets.rootGroup);
        if (!isSoftwareGl) {
          renderer.compile(scene, camera);
        }

        // =========================================================================
        // 6. VISUAL STATE SYNC & UI RENDERING
        // =========================================================================
        function applyVisualStates() {
          assets.skinGroup.visible = state.shellMode === 'skin';
          assets.vesselsGroup.visible = state.showVessels;

          assets.organs.forEach(function (handle, id) {
            var meta = ORGAN_MAP[id];
            var inSystem = state.activeSystem === 'all' || (meta && meta.system === state.activeSystem);
            var isSelected = state.selectedOrganId === id;
            var isHovered = state.hoveredOrganId === id;

            handle.materials.forEach(function (mat) {
              if (isSelected) {
                mat.emissive.setHex(id === 'skin' ? 0x2b3d4f : 0x1f5a85);
                mat.emissiveIntensity = id === 'skin' ? 0.35 : 0.85;
                mat.transparent = false;
                mat.opacity = 1.0;
                mat.depthWrite = true;
              } else if (isHovered && inSystem) {
                mat.emissive.setHex(id === 'skin' ? 0x1e2c3a : 0x163d5c);
                mat.emissiveIntensity = id === 'skin' ? 0.22 : 0.55;
                mat.transparent = false;
                mat.opacity = 1.0;
                mat.depthWrite = true;
              } else if (!inSystem && id !== 'skin') {
                mat.emissive.setHex(mat.userData.baseEmissiveHex || 0x000000);
                mat.emissiveIntensity = 0;
                mat.transparent = true;
                mat.opacity = 0.14;
                mat.depthWrite = false;
              } else {
                mat.emissive.setHex(mat.userData.baseEmissiveHex || 0x000000);
                mat.emissiveIntensity = 0;
                mat.transparent = false;
                mat.opacity = 1.0;
                mat.depthWrite = true;
              }
              mat.needsUpdate = true;
            });
          });
        }

        function focusCameraOnOrgan(organ) {
          var useExplode = organ.id !== 'skin' && organ.id !== 'vessels' ? state.explodeAmount : 0;
          var tx = organ.focusTarget[0] + organ.explodeOffset[0] * useExplode;
          var ty = organ.focusTarget[1] + organ.explodeOffset[1] * useExplode;
          var tz = organ.focusTarget[2] + organ.explodeOffset[2] * useExplode;
          cameraGoal.target.set(tx, ty, tz);
          cameraGoal.position.set(
            tx + organ.focusCameraOffset[0],
            ty + organ.focusCameraOffset[1],
            tz + organ.focusCameraOffset[2]
          );
          cameraGoal.active = true;
        }

        function renderInspector() {
          var organ = state.selectedOrganId ? ORGAN_MAP[state.selectedOrganId] : null;
          if (!organ) {
            elInspector.classList.add('hidden');
            return;
          }

          elInspector.classList.remove('hidden');
          document.getElementById('insp-swatch').style.backgroundColor = organ.accentHex;
          document.getElementById('insp-system').textContent = organ.systemKo;
          document.getElementById('insp-cavity').textContent = organ.cavityKo;
          document.getElementById('insp-name-ko').textContent = organ.nameKo;
          document.getElementById('insp-latin').textContent = organ.nameEn + ' / ' + organ.latinName;
          document.getElementById('insp-summary').textContent = organ.summary;

          var metricsEl = document.getElementById('insp-metrics');
          metricsEl.innerHTML = '';
          organ.metrics.forEach(function (m) {
            var box = document.createElement('div');
            var lbl = document.createElement('div');
            lbl.className = 'metric-label';
            lbl.textContent = m.label;
            var val = document.createElement('div');
            val.className = 'metric-value';
            val.textContent = m.value;
            box.appendChild(lbl);
            box.appendChild(val);
            metricsEl.appendChild(box);
          });

          var fnEl = document.getElementById('insp-functions');
          fnEl.innerHTML = '';
          organ.functions.forEach(function (fn, idx) {
            var li = document.createElement('li');
            li.className = 'fn-item';
            var num = document.createElement('span');
            num.className = 'fn-num';
            num.textContent = String(idx + 1).padStart(2, '0') + '.';
            var txt = document.createElement('span');
            txt.textContent = fn;
            li.appendChild(num);
            li.appendChild(txt);
            fnEl.appendChild(li);
          });

          var termsEl = document.getElementById('insp-terms');
          termsEl.innerHTML = '';
          organ.medicalTerms.forEach(function (t) {
            var row = document.createElement('div');
            row.className = 'term-row';
            var head = document.createElement('div');
            head.className = 'term-head';
            var en = document.createElement('span');
            en.className = 'term-en';
            en.textContent = t.term;
            var ko = document.createElement('span');
            ko.className = 'term-ko';
            ko.textContent = t.korean;
            head.appendChild(en);
            head.appendChild(ko);
            var meaning = document.createElement('p');
            meaning.className = 'term-meaning';
            meaning.textContent = t.meaning;
            row.appendChild(head);
            row.appendChild(meaning);
            termsEl.appendChild(row);
          });

          var relWrap = document.getElementById('insp-related-wrap');
          var relEl = document.getElementById('insp-related');
          relEl.innerHTML = '';
          if (organ.relatedIds && organ.relatedIds.length > 0) {
            relWrap.classList.remove('hidden');
            organ.relatedIds.forEach(function (rid) {
              var rel = ORGAN_MAP[rid];
              if (!rel) return;
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'related-btn';
              btn.textContent = rel.nameKo + ' →';
              btn.addEventListener('click', function () {
                selectOrgan(rid, true);
              });
              relEl.appendChild(btn);
            });
          } else {
            relWrap.classList.add('hidden');
          }

          elInspScroll.scrollTop = 0;
        }

        function renderDirectory() {
          var filtered =
            state.activeSystem === 'all'
              ? ORGANS
              : ORGANS.filter(function (o) {
                  return o.system === state.activeSystem;
                });

          elDirectoryCount.textContent = '장기 및 기관 목록 (' + filtered.length + ')';
          elDirectoryGrid.innerHTML = '';

          filtered.forEach(function (organ) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'dir-item' + (state.selectedOrganId === organ.id ? ' active' : '');
            var sw = document.createElement('span');
            sw.className = 'dot-swatch';
            sw.style.backgroundColor = organ.accentHex;
            var nm = document.createElement('span');
            nm.className = 'dir-name';
            nm.textContent = organ.nameKo;
            btn.appendChild(sw);
            btn.appendChild(nm);
            btn.addEventListener('click', function () {
              state.directoryOpen = false;
              elDirectoryPopover.classList.add('hidden');
              selectOrgan(organ.id, true);
            });
            elDirectoryGrid.appendChild(btn);
          });
        }

        function updateDockControls() {
          var sysBtns = elSystemFilters.querySelectorAll('.sys-btn');
          sysBtns.forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-sys') === state.activeSystem);
          });

          var segBtns = document.querySelectorAll('.seg-btn');
          segBtns.forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-shell') === state.shellMode);
          });

          elBtnVessels.classList.toggle('active-rose', state.showVessels);
          elBtnVessels.setAttribute('aria-pressed', String(state.showVessels));

          elBtnSkeleton.classList.toggle('active-sky', state.showSkeleton);
          elBtnSkeleton.setAttribute('aria-pressed', String(state.showSkeleton));

          var dirBtn = document.getElementById('dir-trigger-btn');
          if (dirBtn) dirBtn.classList.toggle('active', state.directoryOpen);

          elDirectoryPopover.classList.toggle('hidden', state.dockCollapsed || !state.directoryOpen);
          elDockPanel.classList.toggle('collapsed', state.dockCollapsed);
          elDockToggle.setAttribute('aria-expanded', String(!state.dockCollapsed));
          elDockToggleLabel.textContent = state.dockCollapsed ? '컨트롤 보기' : '컨트롤 숨기기';
          elDockChevron.innerHTML = state.dockCollapsed
            ? '<polyline points="18 15 12 9 6 15"></polyline>'
            : '<polyline points="6 9 12 15 18 9"></polyline>';
        }

        function selectOrgan(organId, shouldFocusCamera) {
          state.selectedOrganId = organId;
          if (organId === 'skin') {
            state.shellMode = 'skin';
          } else if (organId && state.shellMode === 'skin' && !SURFACE_VISIBLE_IDS[organId]) {
            state.shellMode = 'xray';
          }
          if (organId === 'vessels') {
            state.showVessels = true;
          }
          applyVisualStates();
          updateDockControls();
          renderDirectory();
          renderInspector();
          if (shouldFocusCamera && organId && ORGAN_MAP[organId]) {
            focusCameraOnOrgan(ORGAN_MAP[organId]);
          }
        }

        // Build System Filter Buttons + Directory Trigger
        SYSTEM_FILTERS.forEach(function (sys) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sys-btn' + (sys.id === 'all' ? ' active' : '');
          btn.setAttribute('data-sys', sys.id);
          btn.textContent = sys.labelKo;
          btn.addEventListener('click', function () {
            state.activeSystem = sys.id;
            if (sys.id === 'cardiovascular') {
              state.showVessels = true;
              if (state.shellMode === 'skin') state.shellMode = 'xray';
            } else if (sys.id !== 'all' && sys.id !== 'sensory' && state.shellMode === 'skin') {
              state.shellMode = 'xray';
            }
            if (state.selectedOrganId) {
              var cur = ORGAN_MAP[state.selectedOrganId];
              if (cur && sys.id !== 'all' && cur.system !== sys.id) {
                state.selectedOrganId = null;
              }
            }
            applyVisualStates();
            updateDockControls();
            renderDirectory();
            renderInspector();
          });
          elSystemFilters.appendChild(btn);
        });

        var divider = document.createElement('div');
        divider.className = 'dock-divider';
        elSystemFilters.appendChild(divider);

        var dirBtn = document.createElement('button');
        dirBtn.id = 'dir-trigger-btn';
        dirBtn.type = 'button';
        dirBtn.className = 'dir-trigger';
        dirBtn.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg><span>기관 목록</span>';
        dirBtn.addEventListener('click', function () {
          state.directoryOpen = !state.directoryOpen;
          renderDirectory();
          updateDockControls();
        });
        elSystemFilters.appendChild(dirBtn);

        // Build Camera Preset Buttons
        CAMERA_PRESETS.forEach(function (preset) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-btn';
          btn.textContent = preset.labelKo;
          btn.addEventListener('click', function () {
            if (preset.id === 'full') {
              selectOrgan(null, false);
            }
            cameraGoal.target.set(preset.target[0], preset.target[1], preset.target[2]);
            cameraGoal.position.set(preset.position[0], preset.position[1], preset.position[2]);
            cameraGoal.active = true;
          });
          elCameraPresets.appendChild(btn);
        });

        // Wire Controls
        elExplodeSlider.addEventListener('input', function (e) {
          var pct = Number(e.target.value);
          state.explodeAmount = pct / 100;
          elExplodeVal.textContent = pct + '%';
        });

        document.querySelectorAll('.seg-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var mode = btn.getAttribute('data-shell');
            state.shellMode = mode;
            if (mode !== 'skin' && state.selectedOrganId === 'skin') {
              state.selectedOrganId = null;
              renderInspector();
            }
            applyVisualStates();
            updateDockControls();
          });
        });

        elBtnVessels.addEventListener('click', function () {
          state.showVessels = !state.showVessels;
          if (!state.showVessels && state.selectedOrganId === 'vessels') {
            state.selectedOrganId = null;
            renderInspector();
          }
          applyVisualStates();
          updateDockControls();
        });

        elBtnSkeleton.addEventListener('click', function () {
          state.showSkeleton = !state.showSkeleton;
          updateDockControls();
        });

        elDockToggle.addEventListener('click', function () {
          state.dockCollapsed = !state.dockCollapsed;
          updateDockControls();
        });

        document.getElementById('directory-close').addEventListener('click', function () {
          state.directoryOpen = false;
          updateDockControls();
        });

        document.getElementById('btn-close-inspector').addEventListener('click', function () {
          selectOrgan(null, false);
        });

        document.getElementById('btn-focus').addEventListener('click', function () {
          if (state.selectedOrganId && ORGAN_MAP[state.selectedOrganId]) {
            focusCameraOnOrgan(ORGAN_MAP[state.selectedOrganId]);
          }
        });

        window.addEventListener('keydown', function (e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.key === 'Escape') {
            selectOrgan(null, false);
          } else if (e.key === 'h' || e.key === 'H') {
            state.dockCollapsed = !state.dockCollapsed;
            updateDockControls();
          }
        });

        // Optional clean ZIP download when served over HTTP(S) and archive exists
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          fetch('./anatomia-3d-singlefile.zip', { method: 'HEAD', cache: 'no-store' })
            .then(function (res) {
              var ctype = (res.headers.get('content-type') || '').toLowerCase();
              if (res.ok && ctype.indexOf('text/html') === -1) {
                elDownloadBtn.classList.remove('hidden');
              }
            })
            .catch(function () {});

          elDownloadBtn.addEventListener('click', function () {
            elDownloadBtn.disabled = true;
            fetch('./anatomia-3d-singlefile.zip', { cache: 'no-store', credentials: 'same-origin' })
              .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.arrayBuffer();
              })
              .then(function (buffer) {
                var bytes = new Uint8Array(buffer);
                var hasHeader = bytes.length > 22 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 0x03 && bytes[3] === 0x04;
                if (!hasHeader) throw new Error('Invalid ZIP');
                var blob = new Blob([buffer], { type: 'application/zip' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'anatomia-3d-singlefile.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
              })
              .catch(function () {})
              .finally(function () {
                elDownloadBtn.disabled = false;
              });
          });
        }

        renderDirectory();
        updateDockControls();
        applyVisualStates();

        // =========================================================================
        // 7. RAYCASTING & MULTI-TOUCH SAFE POINTER HANDLING
        // =========================================================================
        var raycaster = new THREE.Raycaster();
        var pointerVec = new THREE.Vector2();
        var activePointers = new Map();
        var wasMultiTouch = false;
        var lastHoverCheck = 0;

        function isHierarchyVisible(obj) {
          var curr = obj;
          while (curr) {
            if (!curr.visible) return false;
            curr = curr.parent;
          }
          return true;
        }

        function pickOrgan(clientX, clientY) {
          var rect = canvas.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) return null;
          pointerVec.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          pointerVec.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointerVec, camera);
          var rawHits = raycaster.intersectObjects(assets.raycastTargets, false);
          var hits = rawHits.filter(function (h) {
            return isHierarchyVisible(h.object);
          });
          if (hits.length === 0) return null;

          for (var i = 0; i < hits.length; i++) {
            var oid = hits[i].object.userData && hits[i].object.userData.organId;
            if (!oid) continue;
            var meta = ORGAN_MAP[oid];
            if (state.activeSystem === 'all' || (meta && meta.system === state.activeSystem)) {
              return oid;
            }
          }
          return (hits[0].object.userData && hits[0].object.userData.organId) || null;
        }

        canvas.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activePointers.size > 1) wasMultiTouch = true;
        });

        canvas.addEventListener('pointerup', function (e) {
          var start = activePointers.get(e.pointerId);
          activePointers.delete(e.pointerId);
          if (activePointers.size === 0) {
            var multi = wasMultiTouch;
            wasMultiTouch = false;
            if (multi || !start) return;
            var dx = e.clientX - start.x;
            var dy = e.clientY - start.y;
            if (dx * dx + dy * dy > 42) return;
            selectOrgan(pickOrgan(e.clientX, e.clientY), false);
          }
        });

        canvas.addEventListener('pointercancel', function (e) {
          activePointers.delete(e.pointerId);
          if (activePointers.size === 0) wasMultiTouch = false;
        });

        canvas.addEventListener('pointermove', function (e) {
          if (e.pointerType === 'touch') return;
          var now = performance.now();
          if (now - lastHoverCheck < 40) return;
          lastHoverCheck = now;

          var hovered = pickOrgan(e.clientX, e.clientY);
          if (hovered !== state.hoveredOrganId) {
            state.hoveredOrganId = hovered;
            applyVisualStates();
          }
          canvas.style.cursor = hovered ? 'pointer' : 'grab';

          var hoverMeta = hovered ? ORGAN_MAP[hovered] : null;
          if (hoverMeta) {
            elTooltipSwatch.style.backgroundColor = hoverMeta.accentHex;
            elTooltipKo.textContent = hoverMeta.nameKo;
            elTooltipEn.textContent = hoverMeta.nameEn;
            elTooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 220) + 'px';
            elTooltip.style.top = Math.max(e.clientY - 42, 12) + 'px';
            elTooltip.classList.remove('hidden');
          } else {
            elTooltip.classList.add('hidden');
          }
        });

        canvas.addEventListener('pointerleave', function () {
          activePointers.clear();
          wasMultiTouch = false;
          if (state.hoveredOrganId !== null) {
            state.hoveredOrganId = null;
            applyVisualStates();
          }
          canvas.style.cursor = 'grab';
          elTooltip.classList.add('hidden');
        });

        // =========================================================================
        // 8. RESIZE & PACED ANIMATION LOOP
        // =========================================================================
        function handleResize() {
          var w = elViewport.clientWidth || window.innerWidth;
          var h = elViewport.clientHeight || window.innerHeight;
          if (w === 0 || h === 0) return;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }
        window.addEventListener('resize', handleResize);
        if (typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(handleResize).observe(elViewport);
        }

        var clock = new THREE.Clock();
        var currentExplode = 0;
        var currentShellOpacity = isSoftwareGl ? 0.16 : 0.2;
        var currentSkelOpacity = 0.34;
        var tempVec = new THREE.Vector3();

        function afterDraw(cb) {
          var gl = renderer.getContext();
          if (!gl || typeof gl.fenceSync !== 'function') {
            setTimeout(cb, 80);
            return;
          }
          var sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
          if (!sync) {
            setTimeout(cb, 80);
            return;
          }
          gl.flush();
          function poll() {
            var st = gl.getSyncParameter(sync, gl.SYNC_STATUS);
            if (st === gl.UNSIGNALED) {
              setTimeout(poll, 5);
            } else {
              gl.deleteSync(sync);
              setTimeout(cb, 80);
            }
          }
          setTimeout(poll, 5);
        }

        function tick() {
          var delta = Math.min(clock.getDelta(), 0.1);
          var elapsed = clock.getElapsedTime();

          currentExplode = THREE.MathUtils.damp(currentExplode, state.explodeAmount, 7.5, delta);
          assets.organs.forEach(function (handle) {
            if (handle.id === 'skin' || handle.id === 'vessels') return;
            tempVec.copy(handle.basePosition).addScaledVector(handle.explodeOffset, currentExplode);
            handle.group.position.copy(tempVec);
          });

          var targetShell = state.shellMode === 'xray' ? (isSoftwareGl ? 0.16 : 0.2) : 0.0;
          currentShellOpacity = THREE.MathUtils.damp(currentShellOpacity, targetShell, 8, delta);
          assets.shellGroup.visible = currentShellOpacity > 0.008;
          assets.shellMat.opacity = currentShellOpacity;

          var targetSkel = state.showSkeleton ? 0.34 : 0.0;
          currentSkelOpacity = THREE.MathUtils.damp(currentSkelOpacity, targetSkel, 8, delta);
          assets.skeletonGroup.visible = currentSkelOpacity > 0.008;
          assets.boneMat.opacity = currentSkelOpacity;

          var beatPhase = (elapsed * 1.2) % 1;
          var systole =
            Math.exp(-Math.pow((beatPhase - 0.16) / 0.06, 2)) * 0.048 +
            Math.exp(-Math.pow((beatPhase - 0.32) / 0.08, 2)) * 0.022;
          assets.heartGroup.scale.setScalar(1 + systole);

          var breath = (Math.sin(elapsed * 1.55) * 0.5 + 0.5) * 0.028;
          assets.lungsGroup.scale.set(1 + breath, 1 + breath * 0.65, 1 + breath * 1.15);

          if (cameraGoal.active) {
            var df = 6.5;
            controls.target.x = THREE.MathUtils.damp(controls.target.x, cameraGoal.target.x, df, delta);
            controls.target.y = THREE.MathUtils.damp(controls.target.y, cameraGoal.target.y, df, delta);
            controls.target.z = THREE.MathUtils.damp(controls.target.z, cameraGoal.target.z, df, delta);
            camera.position.x = THREE.MathUtils.damp(camera.position.x, cameraGoal.position.x, df, delta);
            camera.position.y = THREE.MathUtils.damp(camera.position.y, cameraGoal.position.y, df, delta);
            camera.position.z = THREE.MathUtils.damp(camera.position.z, cameraGoal.position.z, df, delta);
            if (controls.target.distanceTo(cameraGoal.target) + camera.position.distanceTo(cameraGoal.position) < 0.008) {
              cameraGoal.active = false;
            }
          }

          controls.update();
          renderer.render(scene, camera);

          if (isSoftwareGl) afterDraw(tick);
          else requestAnimationFrame(tick);
        }

        if (isSoftwareGl) {
          renderer.render(scene, camera);
          afterDraw(tick);
        } else {
          requestAnimationFrame(tick);
        }
      })();
    </script>
  </body>
</html>
